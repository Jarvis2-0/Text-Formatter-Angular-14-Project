<div class="text-formatter-page">
  <h1>Text Formatter</h1>
  <div class="two-columns">
    <!-- LEFT PANEL: textareas -->
    <div class="left-panel">
      <label>Type Text :-</label>
      <textarea rows="4" [(ngModel)]="inputText" (input)="onTextChange($event)" placeholder="Type text"></textarea>
      <label>Output Text :-</label>
      <textarea rows="4" [ngStyle]="outputStyles" [(ngModel)]="outputText" readonly></textarea>
    </div>

    <!-- RIGHT PANEL: stats + formatters component -->
    <div class="right-panel">
      <div class="stats-box">
        <p>Word Count: <strong>{{ wordCount$ | async }}</strong> Words</p>
        <p>Char Count: <strong>{{ charCount$ | async }}</strong> Chars</p>
      </div>
      <!-- Use the child component, no duplicate buttons -->
      <app-formatters
        (clear)="clearText()"
        (removeWhitespace)="removeWhiteSpace()"
        (reverseAll)="reverseAll()"
        (removeSpecialChar)="removeSpecialChar()"
        (capitalizeWord)="capitalizeWord()"
        (boldToggle)="toggleBold()"
        (italicToggle)="toggleItalic()"
        (underlineToggle)="toggleUnderline()"
        (colorChange)="changeColor($event)"
        (fontSizeIncrease)="increaseFontSize()"
        (fontSizeDecrease)="decreaseFontSize()"
        (removeStyling)="removeStyling()"
      ></app-formatters>
    </div>
  </div>
</div>
